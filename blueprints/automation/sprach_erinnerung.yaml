blueprint:
  name: Sprach-Erinnerung (Deutsch)
  description: |
    Erinnerungen per Sprachbefehl, komplett lokal, für Assist und Voice PE.

    Beispiele:
    - "Erinnere mich in 45 Sekunden an die Eier"
    - "Erinnere mich in 1 Stunde und 30 Minuten an die Wäsche"
    - "Erinnere mich um 14:15 an die Wäsche"

    Die Erinnerung wird standardmässig auf dem Gerät angesagt, das den Befehl
    gehört hat. Offene Erinnerungen gehen bei einem Neustart von Home Assistant verloren.
  domain: automation
  source_url: https://github.com/oxivanisher/oxivanisher-ha-blueprints/blob/main/blueprints/automation/sprach_erinnerung.yaml
  input:
    prefix:
      name: Ansage-Präfix
      description: >
        Text vor der Erinnerung, z.B. "Erinnerung:" ergibt "Erinnerung: die Wäsche".
      default: "Erinnerung:"
      selector:
        text:
    target_satellites:
      name: Feste Ansage-Geräte (optional)
      description: |
        Leer lassen, um auf dem Gerät anzusagen, das den Befehl gehört hat.
        Sonst wird immer auf diesen Satelliten angesagt.
      default: []
      selector:
        entity:
          domain: assist_satellite
          multiple: true

mode: parallel
max: 20

triggers:
  - trigger: conversation
    command:
      - "(Erinnere|Erinner|Erinnern) mich [bitte] in {duration} an {subject}"
    id: duration
  - trigger: conversation
    command:
      - "(Erinnere|Erinner|Erinnern) mich [bitte] um {time} an {subject}"
    id: clock_time
  - trigger: event
    event_type: voice_reminder_start
    id: run

variables:
  prefix: !input prefix
  target_satellites: !input target_satellites

actions:
  - choose:
      # Teil 2: im Hintergrund warten und ansagen
      - conditions:
          - condition: trigger
            id: run
          - condition: template
            value_template: "{{ trigger.event.data.source == this.entity_id }}"
        sequence:
          - delay:
              seconds: "{{ trigger.event.data.seconds | int }}"
          - if:
              - condition: template
                value_template: "{{ target_satellites | count > 0 }}"
            then:
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ target_satellites }}"
                data:
                  message: "{{ prefix }} {{ trigger.event.data.subject }}"
            else:
              - action: assist_satellite.announce
                target:
                  device_id: "{{ trigger.event.data.device }}"
                data:
                  message: "{{ prefix }} {{ trigger.event.data.subject }}"

      # Teil 1: Sprachbefehl auswerten und sofort antworten
      - conditions:
          - condition: trigger
            id:
              - duration
              - clock_time
        sequence:
          - variables:
              subject: "{{ trigger.slots.get('subject', '') | trim(' .!?') }}"
              seconds: >
                {% if trigger.id == 'duration' %}
                  {% set words = {
                    'ein': 1, 'eine': 1, 'einer': 1, 'einen': 1, 'zwei': 2, 'drei': 3,
                    'vier': 4, 'fünf': 5, 'sechs': 6, 'zehn': 10, 'fünfzehn': 15,
                    'zwanzig': 20, 'dreissig': 30, 'dreißig': 30, 'vierzig': 40,
                    'halben': 0.5, 'halbe': 0.5, 'viertel': 0.25,
                    'eineinhalb': 1.5, 'anderthalb': 1.5 } %}
                  {% set text = trigger.slots.get('duration', '') | lower | replace(',', '.') %}
                  {% set ns = namespace(total=0) %}
                  {% for number, unit in text | regex_findall('([0-9]+(?:[.][0-9]+)?|[a-zäöüß]+)[ ]*(sek[a-z.]*|min[a-z.]*|std[.]?|stunden?)') %}
                    {% set n = number | float(words.get(number, 0)) %}
                    {% set factor = 1 if unit.startswith('sek') else (60 if unit.startswith('min') else 3600) %}
                    {% set ns.total = ns.total + n * factor %}
                  {% endfor %}
                  {{ ns.total | round(0) | int }}
                {% else %}
                  {% set numbers = trigger.slots.get('time', '') | regex_findall('[0-9]+') %}
                  {% set h = (numbers[0] | default(99)) | int %}
                  {% set m = (numbers[1] | default(0)) | int %}
                  {% if h < 24 and m < 60 %}
                    {% set current = now() %}
                    {% set target = current.replace(hour=h, minute=m, second=0, microsecond=0) %}
                    {% if target <= current %}{% set target = target + timedelta(days=1) %}{% endif %}
                    {{ (target - current).total_seconds() | round(0, 'ceil') | int }}
                  {% else %}
                    0
                  {% endif %}
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ seconds | int > 0 and subject | length > 0 }}"
            then:
              - event: voice_reminder_start
                event_data:
                  source: "{{ this.entity_id }}"
                  device: "{{ trigger.device_id }}"
                  seconds: "{{ seconds }}"
                  subject: "{{ subject }}"
              - set_conversation_response: >
                  {% if trigger.id == 'duration' %}
                    Okay, ich erinnere dich in {{ trigger.slots.duration | trim }} an {{ subject }}.
                  {% else %}
                    Okay, ich erinnere dich um {{ (now() + timedelta(seconds=seconds | int)).strftime('%H:%M') }} Uhr an {{ subject }}.
                  {% endif %}
            else:
              - set_conversation_response: "Das habe ich zeitlich nicht verstanden."
