blueprint:
  name: Hörbuch-Schlaftimer (Deutsch)
  description: |
    Schlaftimer per Sprachbefehl, komplett lokal, für Assist und Voice PE.
    Gedacht für Hörbücher über Music Assistant, funktioniert aber mit jedem Media Player.

    Beispiele:
    - "Schlaftimer 20 Minuten"
    - "Stell einen Schlaftimer auf eine halbe Stunde"
    - "Stoppe das Hörbuch in 45 Minuten"
    - "Schlaftimer starten" (Standarddauer)
    - "Schlaftimer abbrechen"

    Kurz vor Ablauf wird die Lautstärke langsam heruntergeblendet, dann wird pausiert
    und die ursprüngliche Lautstärke wiederhergestellt. Ein neuer Schlaftimer ersetzt
    den laufenden. Ohne feste Player wird der Music-Assistant-Player im Raum des
    Sprachgeräts verwendet. Laufende Timer gehen bei einem Neustart von Home Assistant verloren.

    Für Dashboard-Knöpfe, Node-RED oder die REST-API gibt es das Ereignis
    "audiobook_sleep_timer" (Daten: action "start" oder "cancel",
    optional minutes und players). Fehler werden dann als Benachrichtigung in
    Home Assistant gemeldet und zusätzlich als Ereignis "audiobook_error" gesendet.
  domain: automation
  source_url: https://github.com/oxivanisher/oxivanisher-ha-blueprints/blob/main/blueprints/automation/hoerbuch_schlaftimer.yaml
  input:
    fixed_players:
      name: Feste Player (optional)
      description: |
        Leer lassen, um automatisch den Player im Raum (Bereich) des Sprachgeräts zu verwenden.
        Bevorzugt werden Music-Assistant-Player, die gerade abspielen.
        Sonst wirkt der Schlaftimer immer auf diese Player.
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true
    default_minutes:
      name: Standarddauer
      description: Dauer, wenn keine angegeben wird ("Schlaftimer starten").
      default: 30
      selector:
        number:
          min: 1
          max: 180
          unit_of_measurement: min
    fade_seconds:
      name: Ausblendzeit
      description: So lange wird vor dem Pausieren die Lautstärke heruntergeblendet.
      default: 60
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    start_audiobook:
      name: Hörbuch starten, wenn nichts läuft
      description: >
        Läuft beim Stellen des Timers noch nichts, wird das aktuelle Hörbuch gestartet.
        Braucht eine Automation aus dem Blueprint "Hörbuch vorlesen (Deutsch)".
      default: false
      selector:
        boolean:
    clear_queue:
      name: Warteschlange leeren
      description: >
        Nach dem Pausieren die Warteschlange des Players leeren. Sinnvoll, wenn das Buch
        danach auf einem anderen Gerät weitergehört wird, damit hier keine veraltete
        Position hängen bleibt. Beim nächsten Vorlesen wird die Stelle dann frisch
        aus Audiobookshelf geholt.
      default: true
      selector:
        boolean:
    rewind_seconds:
      name: Zurückspulen
      description: >
        So viele Sekunden wird beim Stoppen zurückgespult, damit beim Weiterhören
        ein Stück wiederholt wird. Die Position wird direkt in Audiobookshelf gesetzt.
        Braucht die rest_commands "audiobookshelf_get" und "audiobookshelf_patch"
        (siehe README). 0 = aus.
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    sleep_volume:
      name: Lautstärke im Schlafmodus
      description: >
        Beim Stellen des Timers wird auf diese Lautstärke gesenkt (nie lauter gestellt).
        Startet der Timer das Hörbuch, beginnt es mit dieser Lautstärke. 0 = nicht ändern.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

mode: parallel
max: 20

triggers:
  - trigger: conversation
    command:
      - "[Stell|Stelle|Setz|Setze|Starte|Start|Mach|Mache] [einen|den|mir einen] (Schlaftimer|Schlaf-Timer|Schlaf Timer|Sleeptimer|Sleep-Timer|Sleep Timer|Einschlaftimer) [auf|für|von|in] {duration}"
      - "[Bitte] (Stopp|Stoppe|Stop|Pausiere|Pausier|Beende|Beend) [das Hörbuch|das Hörspiel|die Musik|die Wiedergabe] [bitte] in {duration}"
      - "(Hörbuch|Hörspiel|Musik|Wiedergabe) in {duration} (stoppen|pausieren|beenden|ausschalten)"
      - "Lies [mir] [bitte] [noch] für {duration} vor"
      - "Lies [mir] [bitte] [das|mein] [aktuelle|aktuelles] (Buch|Hörbuch) [noch] für {duration} vor"
      - "(Spiel|Spiele) [bitte] [mir] [mein|das] [aktuelle|aktuelles] (Hörbuch|Hörspiel) [noch] für {duration}"
    id: duration
  - trigger: conversation
    command:
      - "[Stell|Stelle|Setz|Setze|Starte|Start|Mach|Mache] [einen|den|mir einen] (Schlaftimer|Schlaf-Timer|Schlaf Timer|Sleeptimer|Sleep-Timer|Sleep Timer|Einschlaftimer) [an|ein|starten]"
    id: default
  - trigger: conversation
    command:
      - "(Schlaftimer|Schlaf-Timer|Schlaf Timer|Sleeptimer|Sleep-Timer|Sleep Timer|Einschlaftimer) (abbrechen|stoppen|beenden|löschen|aus|ausschalten|deaktivieren)"
      - "(Brich|Stopp|Stoppe|Beende|Lösche|Lösch) [den|meinen] (Schlaftimer|Schlaf-Timer|Schlaf Timer|Sleeptimer|Sleep-Timer|Sleep Timer|Einschlaftimer) [ab]"
      - "Kein (Schlaftimer|Schlaf-Timer|Schlaf Timer|Sleeptimer|Sleep-Timer|Sleep Timer|Einschlaftimer) [mehr]"
    id: cancel
  - trigger: event
    event_type: audiobook_sleep_timer_internal
    id: run
  # Öffentliches Ereignis für Dashboard, Node-RED und REST-API.
  # Daten: action ("start" oder "cancel", Standard "start"),
  # minutes (Standard: Standarddauer), players (Liste, optional), device (optional),
  # volume (Lautstärke im Schlafmodus in Prozent, optional)
  - trigger: event
    event_type: audiobook_sleep_timer
    id: external

variables:
  fixed_players: !input fixed_players
  default_minutes: !input default_minutes
  fade_seconds: !input fade_seconds
  start_audiobook: !input start_audiobook
  clear_queue: !input clear_queue
  rewind_seconds: !input rewind_seconds
  sleep_volume: !input sleep_volume

actions:
  - choose:
      # Teil 2: im Hintergrund warten, ausblenden und pausieren
      - conditions:
          - condition: trigger
            id: run
          - condition: template
            value_template: >
              {{ trigger.event.data.source == this.entity_id and trigger.event.data.action == 'start' }}
        sequence:
          - variables:
              players: "{{ trigger.event.data.players }}"
              total: "{{ trigger.event.data.seconds | int }}"
              fade: "{{ [fade_seconds | int, total] | min }}"
              fade_start: "{{ now().timestamp() + total - fade }}"
          # Warten, bis das Ausblenden beginnt. Ein neuer Timer oder "abbrechen"
          # für einen dieser Player beendet diesen Lauf.
          - repeat:
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      event_type: audiobook_sleep_timer_internal
                  timeout:
                    seconds: "{{ [fade_start - now().timestamp(), 0] | max }}"
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: >
                        {{ wait.trigger is not none
                           and wait.trigger.event.data.source == this.entity_id
                           and wait.trigger.event.data.players | select('in', players) | list | count > 0 }}
                  then:
                    - stop: Schlaftimer ersetzt oder abgebrochen
              until:
                - condition: template
                  value_template: "{{ now().timestamp() >= fade_start - 1 }}"
          - variables:
              active: "{{ players | select('is_state', 'playing') | list }}"
          - condition: template
            value_template: "{{ active | count > 0 }}"
          - variables:
              start_volumes: >
                {% set ns = namespace(items=[]) %}
                {% for p in active %}
                  {% set ns.items = ns.items + [{'player': p, 'volume': state_attr(p, 'volume_level') | float(0.4)}] %}
                {% endfor %}
                {{ ns.items }}
              steps: "{{ 20 if fade > 0 else 0 }}"
          - repeat:
              count: "{{ steps }}"
              sequence:
                - variables:
                    step: "{{ repeat.index }}"
                - repeat:
                    for_each: "{{ start_volumes }}"
                    sequence:
                      - action: media_player.volume_set
                        target:
                          entity_id: "{{ repeat.item.player }}"
                        data:
                          volume_level: "{{ (repeat.item.volume * (1 - step / steps)) | round(3) }}"
                        continue_on_error: true
                - delay:
                    milliseconds: "{{ (fade * 1000 / steps) | int }}"
          # Zurückspulen über Audiobookshelf statt über Music Assistant: Music Assistant meldet
          # nach einem Sprung beim Pausieren eine falsche, zu weit vorne liegende Position.
          - if:
              - condition: template
                value_template: "{{ rewind_seconds | int > 0 }}"
            then:
              # Audiobookshelf-Position vor dem Pausieren lesen. Music Assistant meldet sie dort
              # etwa alle 30 Sekunden, sie liegt also nie vor der gehörten Stelle.
              - action: rest_command.audiobookshelf_get
                data:
                  path: me/items-in-progress
                response_variable: abs_list
                continue_on_error: true
              - variables:
                  rewind_item: >
                    {% set content = abs_list.content if abs_list is defined and abs_list.status | default(0) == 200 and abs_list.content is mapping else {} %}
                    {% set books = content.get('libraryItems', []) | selectattr('mediaType', 'eq', 'book')
                         | selectattr('progressLastUpdate', 'defined') | sort(attribute='progressLastUpdate', reverse=true) | list %}
                    {{ books[0].id if books | count > 0 else '' }}
              - action: rest_command.audiobookshelf_get
                data:
                  path: "me/progress/{{ rewind_item if rewind_item | length > 0 else 'kein-buch' }}"
                response_variable: abs_progress
                continue_on_error: true
              - variables:
                  # Gehörte Stelle schätzen: letzte Meldung plus die Zeit seither (höchstens
                  # 30 Sekunden, damit nie nach vorne gesprungen wird), dann zurückspulen.
                  rewind_target: >
                    {% set p = abs_progress.content if rewind_item | length > 0 and abs_progress is defined
                         and abs_progress.status | default(0) == 200 and abs_progress.content is mapping else {} %}
                    {% set t = p.get('currentTime') %}
                    {% if t is number and t >= 0 %}
                      {% set age = (now().timestamp() * 1000 - p.get('lastUpdate', 0) | float(0)) / 1000 %}
                      {% set heard = t + ([[age, 0] | max, 30] | min) %}
                      {{ [heard - rewind_seconds | int, 0] | max | round(0) | int }}
                    {% else %}
                      -1
                    {% endif %}
              - action: media_player.media_pause
                target:
                  entity_id: "{{ active }}"
                continue_on_error: true
              - delay:
                  seconds: 2
              - if:
                  - condition: template
                    value_template: "{{ clear_queue }}"
                then:
                  - action: media_player.clear_playlist
                    target:
                      entity_id: "{{ active }}"
                    continue_on_error: true
              # Warten, bis Music Assistant seine letzte Meldung an Audiobookshelf geschickt hat,
              # dann die zurückgespulte Position in Audiobookshelf setzen.
              - delay:
                  seconds: 3
              - if:
                  - condition: template
                    value_template: "{{ rewind_target | int >= 0 }}"
                then:
                  - action: rest_command.audiobookshelf_patch
                    data:
                      path: "me/progress/{{ rewind_item }}"
                      payload:
                        currentTime: "{{ rewind_target | int }}"
                    continue_on_error: true
                else:
                  - action: persistent_notification.create
                    data:
                      notification_id: audiobook_sleep_timer
                      title: Hörbuch-Schlaftimer
                      message: >
                        Nicht zurückgespult: Audiobookshelf hat keine Position geliefert. Prüfe die
                        rest_commands audiobookshelf_get und audiobookshelf_patch.
            else:
              - action: media_player.media_pause
                target:
                  entity_id: "{{ active }}"
                continue_on_error: true
              - delay:
                  seconds: 2
              - if:
                  - condition: template
                    value_template: "{{ clear_queue }}"
                then:
                  - action: media_player.clear_playlist
                    target:
                      entity_id: "{{ active }}"
                    continue_on_error: true
          # Lautstärke für das nächste Mal wiederherstellen
          - repeat:
              for_each: "{{ start_volumes }}"
              sequence:
                - action: media_player.volume_set
                  target:
                    entity_id: "{{ repeat.item.player }}"
                  data:
                    volume_level: "{{ repeat.item.volume }}"
                  continue_on_error: true

      # Teil 1: Sprachbefehl auswerten und sofort antworten
      - conditions:
          - condition: trigger
            id:
              - duration
              - default
              - cancel
              - external
        sequence:
          - variables:
              external: "{{ trigger.id == 'external' }}"
              payload: "{{ trigger.event.data if external else {} }}"
              device: "{{ payload.get('device', '') if external else (trigger.device_id or '') }}"
              text: "{{ '' if external else trigger.slots.get('duration', '') | lower | trim(' .!?') }}"
              # Falls ein Satz wie "Schlaftimer aus" beim Platzhalter {duration} landet
              command: >
                {% if external %}
                  {{ 'cancel' if payload.get('action', 'start') | lower in ['cancel', 'stop'] else 'start' }}
                {% elif trigger.id == 'cancel'
                   or text is match('^(abbrechen|stopp|stoppen|stop|beenden|löschen|aus|ausschalten|deaktivieren)$') %}
                  cancel
                {% else %}
                  start
                {% endif %}
              seconds: >
                {% if external %}
                  {{ (payload.get('minutes', default_minutes) | float(0) * 60) | round(0) | int }}
                {% elif trigger.id == 'default' or text is match('^(an|ein|starten|start)$') %}
                  {{ default_minutes | int * 60 }}
                {% else %}
                  {% set words = {
                    'ein': 1, 'eine': 1, 'einer': 1, 'einen': 1, 'zwei': 2, 'drei': 3,
                    'vier': 4, 'fünf': 5, 'sechs': 6, 'sieben': 7, 'acht': 8, 'neun': 9,
                    'zehn': 10, 'elf': 11, 'zwölf': 12, 'fünfzehn': 15, 'zwanzig': 20,
                    'fünfundzwanzig': 25, 'dreissig': 30, 'dreißig': 30, 'vierzig': 40,
                    'fünfundvierzig': 45, 'fünfzig': 50, 'sechzig': 60, 'neunzig': 90,
                    'halben': 0.5, 'halbe': 0.5, 'viertel': 0.25, 'dreiviertel': 0.75,
                    'eineinhalb': 1.5, 'anderthalb': 1.5 } %}
                  {% set t = text | replace(',', '.') %}
                  {% set ns = namespace(total=0) %}
                  {% for number, unit in t | regex_findall('([0-9]+(?:[.][0-9]+)?|[a-zäöüß]+)[ ]*(sek[a-z.]*|min[a-z.]*|std[.]?|stunden?)') %}
                    {% set n = number | float(words.get(number, 0)) %}
                    {% set factor = 1 if unit.startswith('sek') else (60 if unit.startswith('min') else 3600) %}
                    {% set ns.total = ns.total + n * factor %}
                  {% endfor %}
                  {% if ns.total == 0 %}
                    {# Zahl ohne Einheit, z.B. "Schlaftimer 20", gilt als Minuten #}
                    {% set z = t | regex_findall('[0-9]+') %}
                    {% set ns.total = (z[0] | int * 60) if z | count > 0 else words.get(t, 0) * 60 %}
                  {% endif %}
                  {{ ns.total | round(0) | int }}
                {% endif %}
              players_raw: >
                {% set event_players = payload.get('players', []) %}
                {% if event_players %}
                  {{ [event_players] if event_players is string else event_players }}
                {% elif fixed_players | count > 0 %}
                  {{ fixed_players }}
                {% elif external and not device %}
                  {# Ohne Sprachgerät: die Music-Assistant-Player, die gerade abspielen.
                     Mitglieder einer laufenden Gruppe werden weggelassen, damit nicht doppelt
                     ausgeblendet wird. #}
                  {% set playing = integration_entities('music_assistant') | select('match', 'media_player[.]')
                       | select('is_state', 'playing') | list %}
                  {% set ns = namespace(members=[]) %}
                  {% for e in playing %}
                    {% set m = state_attr(e, 'group_members') or [] %}
                    {% set queue = state_attr(e, 'active_queue') %}
                    {% if state_attr(e, 'mass_player_type') == 'group' or (m | count > 1 and m[0] == e) %}
                      {% set ns.members = ns.members + (m | reject('eq', e) | list) %}
                      {% for p in playing if p != e and queue and state_attr(p, 'active_queue') == queue %}
                        {% set ns.members = ns.members + [p] %}
                      {% endfor %}
                    {% endif %}
                  {% endfor %}
                  {{ playing | reject('in', ns.members) | list }}
                {% else %}
                  {% set ma_all = integration_entities('music_assistant') | select('match', 'media_player[.]') | list %}
                  {% set area = area_id(device) if device else none %}
                  {% set in_area = (area_entities(area) if area else []) | select('match', 'media_player[.]') | list %}
                  {% set ma = ma_all | select('in', in_area) | list %}
                  {% if ma | count == 0 and device %}
                    {# Music-Assistant-Player ohne Bereich: über den Namen des Sprachgeräts suchen #}
                    {% set names = ([device_attr(device, 'name_by_user'), device_attr(device, 'name')]
                         + device_entities(device) | select('match', 'media_player[.]') | map('state_attr', 'friendly_name') | list)
                         | select | map('lower') | list %}
                    {% set ns = namespace(matches=[]) %}
                    {% for e in ma_all if (state_attr(e, 'group_members') or []) | count <= 1 and state_attr(e, 'mass_player_type') != 'group' %}
                      {% set n = (state_attr(e, 'friendly_name') or '') | lower %}
                      {% if names | select('in', n) | list | count > 0 %}{% set ns.matches = ns.matches + [e] %}{% endif %}
                    {% endfor %}
                    {% set ma = ns.matches %}
                  {% endif %}
                  {% set candidates = ma if ma | count > 0 else in_area %}
                  {% set playing = candidates | select('is_state', 'playing') | list %}
                  {{ playing if playing | count > 0 else candidates[:1] }}
                {% endif %}
              # Gehört ein Player zu einer laufenden Lautsprechergruppe, wirkt der Timer
              # auf die ganze Gruppe: alle Räume werden gemeinsam ausgeblendet und gestoppt.
              # Mitglied ist ein Player, wenn er in group_members steht oder dieselbe
              # Music-Assistant-Warteschlange (active_queue) abspielt wie die Gruppe.
              # Als Gruppe zählt nur eine Music-Assistant-Gruppe oder ein Sync-Leader
              # (steht selbst an erster Stelle in group_members), nicht die Mitglieder.
              players: >
                {% set ns = namespace(items=[]) %}
                {% for p in players_raw %}
                  {% set ns2 = namespace(matches=[]) %}
                  {% for g in integration_entities('music_assistant') | select('match', 'media_player[.]')
                       if g not in players_raw and is_state(g, 'playing')
                          and state_attr(p, 'mass_player_type') != 'group' %}
                    {% set m = state_attr(g, 'group_members') or [] %}
                    {% set queue = state_attr(g, 'active_queue') %}
                    {% if (state_attr(g, 'mass_player_type') == 'group' or (m | count > 1 and m[0] == g))
                          and (p in m or (queue and state_attr(p, 'active_queue') == queue)) %}
                      {% set ns2.matches = ns2.matches + [g] %}
                    {% endif %}
                  {% endfor %}
                  {% set ns.items = ns.items + (ns2.matches if ns2.matches | count > 0 else [p]) %}
                {% endfor %}
                {{ ns.items | unique | list }}
              start_book: >
                {{ start_audiobook and players | select('is_state', 'playing') | list | count == 0 }}
              # Lautstärke im Schlafmodus, über die API auch pro Aufruf (volume)
              target_volume: >
                {% set v = payload.get('volume') %}
                {{ [(v if v is not none else sleep_volume) | int(0), 100] | min }}
              duration_text: >
                {% set s = seconds | int %}
                {% set h = s // 3600 %}
                {% set m = (s % 3600) // 60 %}
                {% set parts = [] %}
                {% if h > 0 %}{% set parts = parts + [h ~ (' Stunde' if h == 1 else ' Stunden')] %}{% endif %}
                {% if m > 0 %}{% set parts = parts + [m ~ (' Minute' if m == 1 else ' Minuten')] %}{% endif %}
                {% if parts | count == 0 %}{% set parts = [s ~ ' Sekunden'] %}{% endif %}
                {{ parts | join(' und ') }}
              # Nur für Dashboard, Node-RED und REST-API: Fehler, die gemeldet werden
              error: >
                {% if not external %}
                {% elif players | count == 0 %}
                  Schlaftimer nicht {{ 'abgebrochen' if command == 'cancel' else 'gestellt' }}: Es läuft gerade nichts und in der Automation sind
                  keine festen Player eingestellt.
                {% elif command == 'start' and seconds | int <= 0 %}
                  Schlaftimer nicht gestellt: Die Dauer "{{ payload.get('minutes') }}" ist keine gültige Anzahl Minuten.
                {% elif command == 'start' and not start_book and players | select('is_state', 'playing') | list | count == 0 %}
                  Schlaftimer gestellt, aber auf {{ players | map('state_attr', 'friendly_name') | join(', ') }}
                  läuft gerade nichts. "Hörbuch starten, wenn nichts läuft" ist ausgeschaltet.
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ error | trim | length > 0 }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: audiobook_sleep_timer
                  title: Hörbuch-Schlaftimer
                  message: "{{ error | trim }}"
              - event: audiobook_error
                event_data:
                  source: "{{ this.entity_id }}"
                  message: "{{ error | trim }}"
              - if:
                  - condition: template
                    value_template: "{{ device | length > 0 }}"
                then:
                  - action: assist_satellite.announce
                    target:
                      device_id: "{{ device }}"
                    data:
                      message: "{{ error | trim }}"
                    continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ players | count == 0 }}"
            then:
              - set_conversation_response: >
                  Ich habe keinen Player gefunden. Ordne das Sprachgerät einem Bereich
                  mit einem Player zu oder lege feste Player in der Automation fest.
              - stop: Kein Player gefunden
          - if:
              - condition: template
                value_template: "{{ command == 'cancel' }}"
            then:
              - event: audiobook_sleep_timer_internal
                event_data:
                  source: "{{ this.entity_id }}"
                  action: cancel
                  players: "{{ players }}"
              - set_conversation_response: Okay, Schlaftimer abgebrochen.
            else:
              - if:
                  - condition: template
                    value_template: "{{ seconds | int > 0 }}"
                then:
                  - event: audiobook_sleep_timer_internal
                    event_data:
                      source: "{{ this.entity_id }}"
                      action: start
                      players: "{{ players }}"
                      seconds: "{{ seconds }}"
                  - if:
                      - condition: template
                        value_template: "{{ start_book }}"
                    then:
                      # Startet die Automation aus dem Blueprint "Hörbuch vorlesen",
                      # mit der Lautstärke im Schlafmodus
                      - event: audiobook_play
                        event_data:
                          players: "{{ players }}"
                          device: "{{ device }}"
                          volume: "{{ target_volume | int }}"
                      - set_conversation_response: "Okay, ich lese dir {{ duration_text }} vor."
                    else:
                      # Läuft schon etwas: auf die Lautstärke im Schlafmodus senken,
                      # aber nie lauter stellen
                      - repeat:
                          for_each: >
                            {% set ns = namespace(items=[]) %}
                            {% if target_volume | int > 0 %}
                              {% for p in players if is_state(p, 'playing')
                                   and state_attr(p, 'volume_level') | float(0) > target_volume | int / 100 %}
                                {% set ns.items = ns.items + [p] %}
                              {% endfor %}
                            {% endif %}
                            {{ ns.items }}
                          sequence:
                            - action: media_player.volume_set
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                volume_level: "{{ target_volume | int / 100 }}"
                              continue_on_error: true
                      - set_conversation_response: "Okay, Schlaftimer auf {{ duration_text }} gestellt."
                else:
                  - set_conversation_response: Das habe ich zeitlich nicht verstanden.
