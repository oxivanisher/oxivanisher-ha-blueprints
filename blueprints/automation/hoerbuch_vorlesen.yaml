blueprint:
  name: Hörbuch vorlesen (Deutsch)
  description: |
    Liest per Sprachbefehl das aktuelle Hörbuch aus Audiobookshelf über
    Music Assistant vor, komplett lokal, für Assist und Voice PE.

    Beispiele:
    - "Lies mir das aktuelle Buch vor"
    - "Lies mir weiter vor"
    - "Spiel mein Hörbuch"
    - "Hörbuch weiterhören"
    - "Stopp das Hörbuch" / "Hör auf vorzulesen"

    Beim Stoppen wird pausiert und danach die Warteschlange des Players geleert,
    damit das Buch auf einem anderen Gerät ohne veraltete Position weitergehen kann.

    Welches Buch gerade gehört wird, wird direkt bei Audiobookshelf abgefragt
    (/api/me/items-in-progress). So geht es auch dann an der richtigen Stelle weiter,
    wenn zwischendurch auf einem anderen Gerät gehört wurde. Dafür braucht es einmalig
    einen rest_command namens "audiobookshelf_in_progress" in der configuration.yaml,
    siehe README.

    Der Hörbuch-Schlaftimer kann diese Automation über das Ereignis
    "audiobook_play" starten, wenn noch nichts läuft. Über dasselbe Ereignis
    lassen sich auch Dashboard-Knöpfe bauen (Daten: action "start", "stop" oder
    "toggle", optional players). Ohne players werden die festen Player verwendet,
    z.B. eine Lautsprechergruppe für alle Räume.
    Ohne feste Player wird der Music-Assistant-Player im Raum des Sprachgeräts verwendet.
  domain: automation
  source_url: https://github.com/oxivanisher/oxivanisher-ha-blueprints/blob/main/blueprints/automation/hoerbuch_vorlesen.yaml
  input:
    fixed_players:
      name: Feste Player (optional)
      description: |
        Leer lassen, um automatisch den Music-Assistant-Player im Raum (Bereich)
        des Sprachgeräts zu verwenden. Sonst wird immer auf diesen Playern abgespielt.
      default: []
      selector:
        entity:
          domain: media_player
          integration: music_assistant
          multiple: true
    rewind_seconds:
      name: Zurückspulen
      description: >
        Beim Stoppen wird so viele Sekunden zurückgespult. Beim Weiterhören wird
        dieses Stück wiederholt. 0 = aus.
      default: 30
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s

mode: parallel
max: 10

triggers:
  - trigger: conversation
    command:
      - "Lies [mir] [bitte] [das|mein] [aktuelle|aktuelles] (Buch|Hörbuch) [weiter] vor"
      - "Lies [mir] [bitte] weiter vor"
      - "Lies [mein] (Buch|Audiobuch) weiter [vor]"
      - "(Spiel|Spiele|Starte|Start) [bitte] [mein|das|mir mein|mir das] [aktuelle|aktuelles] (Hörbuch|Hörspiel) [weiter|ab]"
      - "(Hörbuch|Hörspiel) (weiter|weiterhören|weiterspielen|fortsetzen|abspielen|starten)"
      - "Ich möchte [mein Hörbuch] weiterhören"
    id: voice
  - trigger: conversation
    command:
      - "(Stopp|Stoppe|Stop|Beende|Beend|Pausiere|Pausier) [bitte] [das|mein] (Hörbuch|Hörspiel|Buch|Audiobuch|Vorlesen)"
      - "(Hörbuch|Hörspiel|Vorlesen) (stoppen|beenden|pausieren|aus|ausschalten)"
      - "Hör [bitte] auf (vorzulesen|zu lesen)"
      - "Nicht mehr vorlesen"
    id: stop
  # Wird z.B. vom Hörbuch-Schlaftimer oder von Dashboard-Skripten ausgelöst.
  # Daten: action ("start", "stop" oder "toggle", Standard "start"),
  # players (Liste, optional), device (optional)
  - trigger: event
    event_type: audiobook_play
    id: event

variables:
  fixed_players: !input fixed_players
  rewind_seconds: !input rewind_seconds

actions:
  - variables:
      command: >
        {{ trigger.event.data.get('action', 'start') | lower if trigger.id == 'event' else '' }}
      device: >
        {{ trigger.event.data.get('device', '') if trigger.id == 'event' else (trigger.device_id or '') }}
      players: >
        {% if trigger.id == 'event' and trigger.event.data.get('players') %}
          {% set p = trigger.event.data.players %}
          {{ [p] if p is string else p }}
        {% elif fixed_players | count > 0 %}
          {{ fixed_players }}
        {% else %}
          {% set ma_all = integration_entities('music_assistant') | select('match', 'media_player[.]') | list %}
          {% set area = area_id(device) if device else none %}
          {% set ma = ma_all | select('in', area_entities(area) if area else []) | list %}
          {% if ma | count == 0 and device %}
            {# Music-Assistant-Player ohne Bereich: über den Namen des Sprachgeräts suchen #}
            {% set names = ([device_attr(device, 'name_by_user'), device_attr(device, 'name')]
                 + device_entities(device) | select('match', 'media_player[.]') | map('state_attr', 'friendly_name') | list)
                 | select | map('lower') | list %}
            {% set ns = namespace(matches=[]) %}
            {% for e in ma_all if (state_attr(e, 'group_members') or []) | count <= 1 and state_attr(e, 'mass_player_type') != 'group' %}
              {% set n = (state_attr(e, 'friendly_name') or '') | lower %}
              {% if names | select('in', n) | list | count > 0 %}{% set ns.matches = ns.matches + [e] %}{% endif %}
            {% endfor %}
            {% set ma = ns.matches %}
          {% endif %}
          {{ ma }}
        {% endif %}
      # Läuft einer der Player oder eine Lautsprechergruppe, zu der einer gehört?
      is_playing: >
        {% set ns = namespace(yes=players | select('is_state', 'playing') | list | count > 0) %}
        {% for e in integration_entities('music_assistant') | select('match', 'media_player[.]')
             if not ns.yes and e not in players and is_state(e, 'playing') %}
          {% set members = state_attr(e, 'group_members') or [] %}
          {% set queue = state_attr(e, 'active_queue') %}
          {% if state_attr(e, 'mass_player_type') == 'group' or (members | count > 1 and members[0] == e) %}
            {% for p in players if state_attr(p, 'mass_player_type') != 'group' %}
              {% if p in members or (queue and state_attr(p, 'active_queue') == queue) %}
                {% set ns.yes = true %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {{ ns.yes }}
      # "toggle": stoppen, wenn etwas läuft, sonst starten
      event_stop: >
        {{ command == 'stop' or (command == 'toggle' and is_playing) }}

  - choose:
      # Hörbuch stoppen und Warteschlange leeren
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'stop' or event_stop }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ players | count == 0 }}"
            then:
              - if:
                  - condition: trigger
                    id: stop
                then:
                  - set_conversation_response: >
                      Ich habe keinen Music-Assistant-Player gefunden. Weise den Music-Assistant-Player
                      dem gleichen Bereich zu wie das Sprachgerät, oder lege feste Player in der Automation fest.
                else:
                  - action: persistent_notification.create
                    data:
                      notification_id: audiobook_play
                      title: Hörbuch vorlesen
                      message: "Hörbuch nicht gestoppt: Es ist kein Player angegeben und in der Automation sind keine festen Player eingestellt."
                  - event: audiobook_error
                    event_data:
                      source: "{{ this.entity_id }}"
                      message: "Hörbuch nicht gestoppt: Es ist kein Player angegeben und in der Automation sind keine festen Player eingestellt."
              - stop: Kein Player gefunden
          - variables:
              # Läuft eine Lautsprechergruppe, zu der einer der Player gehört,
              # wird die ganze Gruppe gestoppt statt nur der einzelne Lautsprecher.
              # Mitglied ist ein Player, wenn er in group_members steht oder dieselbe
              # Music-Assistant-Warteschlange (active_queue) abspielt wie die Gruppe.
              # Als Gruppe zählt nur eine Music-Assistant-Gruppe oder ein Sync-Leader
              # (steht selbst an erster Stelle in group_members), nicht die Mitglieder.
              targets: >
                {% set ns = namespace(groups=[]) %}
                {% for e in integration_entities('music_assistant') | select('match', 'media_player[.]')
                     if e not in players and is_state(e, 'playing') %}
                  {% set members = state_attr(e, 'group_members') or [] %}
                  {% set queue = state_attr(e, 'active_queue') %}
                  {% if state_attr(e, 'mass_player_type') == 'group' or (members | count > 1 and members[0] == e) %}
                    {% for p in players if state_attr(p, 'mass_player_type') != 'group' %}
                      {% if p in members or (queue and state_attr(p, 'active_queue') == queue) %}
                        {% set ns.groups = ns.groups + [e] %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                {% endfor %}
                {% set ns.groups = ns.groups | unique | list %}
                {% set active = players | select('is_state', 'playing') | list %}
                {% if ns.groups | count > 0 %}
                  {{ ns.groups }}
                {% else %}
                  {{ active if active | count > 0 else players }}
                {% endif %}
          # Vor dem Pausieren zurückspulen, damit beim Weiterhören ein Stück wiederholt
          # wird. Music Assistant meldet beim Pausieren diese Position an Audiobookshelf.
          - repeat:
              for_each: "{{ targets | select('is_state', 'playing') | list if rewind_seconds | int > 0 else [] }}"
              sequence:
                - variables:
                    position: >
                      {% set pos = state_attr(repeat.item, 'media_position') %}
                      {% set updated = state_attr(repeat.item, 'media_position_updated_at') %}
                      {% if pos is number and updated %}
                        {{ pos + (now() - as_datetime(updated | string)).total_seconds() }}
                      {% else %}
                        -1
                      {% endif %}
                - if:
                    - condition: template
                      value_template: "{{ position | float(-1) >= 0 }}"
                  then:
                    - action: media_player.media_seek
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        seek_position: "{{ [position | float - rewind_seconds | int, 0] | max | round(0) | int }}"
                      continue_on_error: true
          - delay:
              seconds: "{{ 1 if rewind_seconds | int > 0 else 0 }}"
          - action: media_player.media_pause
            target:
              entity_id: "{{ targets }}"
            continue_on_error: true
          - if:
              - condition: trigger
                id: stop
            then:
              - set_conversation_response: Okay, Hörbuch gestoppt.
          # Kurz warten, damit Music Assistant die Position an Audiobookshelf meldet
          - delay:
              seconds: 2
          - action: media_player.clear_playlist
            target:
              entity_id: "{{ targets }}"
            continue_on_error: true
    # Hörbuch starten
    default:
      - action: rest_command.audiobookshelf_in_progress
        response_variable: response
        continue_on_error: true

      - variables:
          book: >
            {% set content = response.content if response is defined and response.status | default(0) == 200 else {} %} {% set books = content.libraryItems | default([]) | selectattr('mediaType', 'eq', 'book') | list %} {% if books | count > 0 and books | selectattr('progressLastUpdate', 'defined') | list | count == books | count %}
              {% set books = books | sort(attribute='progressLastUpdate', reverse=true) %}
            {% endif %} {{ books[0].media.metadata.title | default('') if books | count > 0 else '' }}
          error: >
            {% if players | count == 0 %}
              Ich habe keinen Music-Assistant-Player gefunden. Weise den Music-Assistant-Player
              dem gleichen Bereich zu wie das Sprachgerät, oder lege feste Player in der Automation fest.
            {% elif response is not defined or response.status | default(0) != 200 %}
              Audiobookshelf hat nicht geantwortet.
            {% elif book | length == 0 %}
              Du hast gerade kein Hörbuch angefangen.
            {% endif %}

      - if:
          - condition: template
            value_template: "{{ error | trim | length > 0 }}"
        then:
          - if:
              - condition: trigger
                id: voice
            then:
              - set_conversation_response: "{{ error | trim }}"
            else:
              # Über das Ereignis gestartet: Fehler melden und auf dem Sprachgerät ansagen
              - action: persistent_notification.create
                data:
                  notification_id: audiobook_play
                  title: Hörbuch vorlesen
                  message: "{{ error | trim }}"
              - event: audiobook_error
                event_data:
                  source: "{{ this.entity_id }}"
                  message: "{{ error | trim }}"
              - if:
                  - condition: template
                    value_template: "{{ device | length > 0 }}"
                then:
                  - action: assist_satellite.announce
                    target:
                      device_id: "{{ device }}"
                    data:
                      message: "{{ error | trim }}"
                    continue_on_error: true
          - stop: Hörbuch konnte nicht gestartet werden

      - if:
          - condition: trigger
            id: voice
        then:
          - set_conversation_response: "Okay, {{ book }}."
      # "replace" ersetzt eine alte Warteschlange, Music Assistant setzt an der
      # in Audiobookshelf gespeicherten Stelle fort.
      - action: music_assistant.play_media
        target:
          entity_id: "{{ players if fixed_players | count > 0 or trigger.id == 'event' else players[:1] }}"
        data:
          media_type: audiobook
          media_id: "{{ book }}"
          enqueue: replace
